<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ config.name }}</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='styles/main.css') }}">
    <style>
        .scheduler-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            font-size: 13px;
            color: var(--text-secondary, #666);
            justify-content: center;
        }
        .scheduler-label {
            font-weight: 600;
            color: var(--text-primary, #333);
        }
        .scheduler-mode {
            color: var(--text-secondary, #666);
        }
        .scheduler-mode.active {
            color: var(--accent-primary, #1abc9c);
            font-weight: 600;
        }
        .scheduler-time {
            color: var(--text-light, #999);
            font-size: 12px;
        }
    </style>
    <script>
        (function() {
            const theme = localStorage.getItem('inkypi-theme') || 
                         (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
        let lastModified = null;
        let imageCacheBuster = 0;

        let anyDemoRunning = false;

        async function refreshImage() {
            const img = document.querySelector('.image-container img');
            if (!img) return;

            try {
                const headers = {};
                if (lastModified && !anyDemoRunning) {
                    headers['If-Modified-Since'] = lastModified;
                }

                const ts = anyDemoRunning ? Date.now() : imageCacheBuster;
                const response = await fetch('{{ url_for("main.get_current_image") }}?t=' + ts, { headers });
                
                if (response.status === 304) {
                    return;
                }

                if (!response.ok) {
                    console.error('Failed to fetch image:', response.status);
                    return;
                }

                const blob = await response.blob();
                const objectUrl = URL.createObjectURL(blob);
                
                img.src = objectUrl;
                lastModified = response.headers.get('Last-Modified');
            } catch (error) {
                console.error('Error refreshing image:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            refreshImage();
            setInterval(refreshImage, 2000);
        });
    </script>
    <script src="{{ url_for('static', filename='scripts/image_modal.js') }}"></script>
</head>
<body>
    <script src="{{ url_for('static', filename='scripts/dark_mode.js') }}"></script>
    <!-- Subtle frame container -->
    <div class="frame">
        <!-- Page Title -->
        <header class="header">
            <h1>{{ config.name }}</h1>
            <button class="settings-button dark-mode-toggle" title="Toggle Dark Mode" aria-label="Toggle Dark Mode"></button>
            <a href="{{ url_for('apikeys.apikeys_page') }}" class="settings-button" title="API Keys">
                <span style="font-size: 20px;">🔑</span>
            </a>
            <a href="{{ url_for('playlist.playlists') }}" class="settings-button">
                <img src="{{ url_for('static', filename='icons/playlist.png') }}" title="Playlists" alt="playlists icon" class="icon-image">
            </a>
            <a href="{{ url_for('settings.settings_page') }}" class="settings-button">
                <img src="{{ url_for('static', filename='icons/settings.png') }}" title="Settings" alt="settings icon" class="icon-image">
            </a>
        </header>

        <!-- Display the current image -->
        <div class="image-container">
            <img src="{{ url_for('static', filename='images/current_image.png') }}" alt="Current Image">
        </div>

        <!-- Preview buttons -->
        <div class="preview-buttons">
            <button class="preview-btn" onclick="previewInterrupt('calendar')">Calendar Alert</button>
            <button class="preview-btn" onclick="previewInterrupt('weather_alert')">Weather Alert</button>
            <button class="preview-btn" id="demoBtn" onclick="toggleDemo()">Demo Cycle</button>
            <button class="preview-btn" id="schedSimBtn" onclick="toggleSchedSim()">Scheduler Sim</button>
        </div>

        <!-- Scheduler Status -->
        <div id="schedulerStatus" class="scheduler-status">
            <span class="scheduler-label">Scheduler:</span>
            <span id="schedulerMode" class="scheduler-mode">—</span>
            <span id="schedulerTime" class="scheduler-time"></span>
        </div>

        <!-- Separator -->
        <div class="separator"></div>

        <div class="plugins-header">
            <h2 class="plugins-title">Plugins</h2>
            <div class="plugins-controls">
                <button class="sort-toggle" id="sortToggle" title="Reorder plugins">Sort</button>
                <button class="view-toggle" id="viewToggle" title="Switch view">List</button>
            </div>
        </div>

        <div class="sort-hint" id="sortHint">Drag plugins to reorder. Click "Save" when done.</div>

        <div class="plugins-container" id="pluginsContainer">
            {% for plugin in plugins %}
            <a href="{{ url_for('plugin.plugin_page', plugin_id=plugin.id) }}"
               class="plugin-item"
               data-plugin-id="{{ plugin.id }}"
               title="{{ plugin.display_name }}"
               draggable="false">
                <img src="{{ url_for('plugin.image', plugin_id=plugin.id, filename='icon.png') }}"
                     alt="{{ plugin.display_name }}"
                     class="icon-image">
                <span class="plugin-name">{{ plugin.display_name }}</span>
            </a>
            {% endfor %}
        </div>

        <script>
            // View mode (grid/list)
            const viewToggle = document.getElementById('viewToggle');
            const pluginsContainer = document.getElementById('pluginsContainer');
            let currentView = localStorage.getItem('inkypi-plugins-view') || 'grid';

            function updateView() {
                if (currentView === 'list') {
                    pluginsContainer.classList.add('list-view');
                    viewToggle.textContent = 'Grid';
                } else {
                    pluginsContainer.classList.remove('list-view');
                    viewToggle.textContent = 'List';
                }
            }

            viewToggle.addEventListener('click', () => {
                currentView = currentView === 'grid' ? 'list' : 'grid';
                localStorage.setItem('inkypi-plugins-view', currentView);
                updateView();
            });

            updateView();

            async function previewInterrupt(type) {
                try {
                    const response = await fetch(`/api/preview/${type}_interrupt`);
                    if (response.ok) {
                        lastModified = null;
                        refreshImage();
                    }
                } catch (error) {
                    console.error('Preview error:', error);
                }
            }

            async function toggleSchedSim() {
                const btn = document.getElementById('schedSimBtn');
                try {
                    if (anyDemoRunning) {
                        await fetch('/api/demo/stop');
                        anyDemoRunning = false;
                        btn.textContent = 'Scheduler Sim';
                        btn.classList.remove('active');
                        document.getElementById('demoBtn').textContent = 'Demo Cycle';
                        document.getElementById('demoBtn').classList.remove('active');
                    } else {
                        const res = await fetch('/api/demo/scheduler/start');
                        const data = await res.json();
                        if (data.success) {
                            anyDemoRunning = true;
                            btn.textContent = 'Stop SchedSim';
                            btn.classList.add('active');
                            imageCacheBuster = Date.now();
                            lastModified = null;
                            refreshImage();
                        }
                    }
                } catch (e) {
                    console.error('SchedSim error:', e);
                }
            }
            async function toggleDemo() {
                const btn = document.getElementById('demoBtn');
                try {
                    if (anyDemoRunning) {
                        await fetch('/api/demo/stop');
                        anyDemoRunning = false;
                        btn.textContent = 'Demo Cycle';
                        btn.classList.remove('active');
                        document.getElementById('schedSimBtn').textContent = 'Scheduler Sim';
                        document.getElementById('schedSimBtn').classList.remove('active');
                    } else {
                        const res = await fetch('/api/demo/start');
                        const data = await res.json();
                        if (data.success) {
                            anyDemoRunning = true;
                            btn.textContent = 'Stop Demo';
                            btn.classList.add('active');
                            imageCacheBuster = Date.now();
                            lastModified = null;
                            refreshImage();
                        }
                    }
                } catch (error) {
                    console.error('Demo error:', error);
                }
            }

            // Sort mode
            const sortToggle = document.getElementById('sortToggle');
            const sortHint = document.getElementById('sortHint');
            let isSorting = false;
            let draggedItem = null;

            function enableSorting() {
                isSorting = true;
                sortToggle.classList.add('active');
                sortToggle.textContent = 'Save';
                sortHint.classList.add('visible');
                pluginsContainer.classList.add('sorting');

                document.querySelectorAll('.plugin-item').forEach(item => {
                    item.draggable = true;
                    item.addEventListener('dragstart', handleDragStart);
                    item.addEventListener('dragend', handleDragEnd);
                    item.addEventListener('dragover', handleDragOver);
                    item.addEventListener('dragleave', handleDragLeave);
                    item.addEventListener('drop', handleDrop);
                    item.addEventListener('click', preventClick);
                });
            }

            function disableSorting() {
                isSorting = false;
                sortToggle.classList.remove('active');
                sortToggle.textContent = 'Sort';
                sortHint.classList.remove('visible');
                pluginsContainer.classList.remove('sorting');

                document.querySelectorAll('.plugin-item').forEach(item => {
                    item.draggable = false;
                    item.removeEventListener('dragstart', handleDragStart);
                    item.removeEventListener('dragend', handleDragEnd);
                    item.removeEventListener('dragover', handleDragOver);
                    item.removeEventListener('dragleave', handleDragLeave);
                    item.removeEventListener('drop', handleDrop);
                    item.removeEventListener('click', preventClick);
                });

                // Save order
                savePluginOrder();
            }

            function preventClick(e) {
                if (isSorting) {
                    e.preventDefault();
                }
            }

            function handleDragStart(e) {
                draggedItem = this;
                this.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
            }

            function handleDragEnd(e) {
                this.classList.remove('dragging');
                document.querySelectorAll('.plugin-item').forEach(item => {
                    item.classList.remove('drag-over');
                });
            }

            function handleDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                if (this !== draggedItem) {
                    this.classList.add('drag-over');
                }
            }

            function handleDragLeave(e) {
                this.classList.remove('drag-over');
            }

            function handleDrop(e) {
                e.preventDefault();
                this.classList.remove('drag-over');

                if (this !== draggedItem) {
                    const items = Array.from(pluginsContainer.children);
                    const draggedIndex = items.indexOf(draggedItem);
                    const targetIndex = items.indexOf(this);

                    if (draggedIndex < targetIndex) {
                        this.parentNode.insertBefore(draggedItem, this.nextSibling);
                    } else {
                        this.parentNode.insertBefore(draggedItem, this);
                    }
                }
            }

            async function savePluginOrder() {
                const order = Array.from(pluginsContainer.children).map(item => item.dataset.pluginId);
                try {
                    const response = await fetch('{{ url_for("main.save_plugin_order") }}', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ order: order })
                    });
                    if (!response.ok) {
                        console.error('Failed to save plugin order');
                    }
                } catch (error) {
                    console.error('Error saving plugin order:', error);
                }
            }

            sortToggle.addEventListener('click', () => {
                if (isSorting) {
                    disableSorting();
                } else {
                    enableSorting();
                }
            });

            // Scheduler status polling
            async function updateSchedulerStatus() {
                try {
                    const res = await fetch('/api/scheduler/status');
                    if (res.ok) {
                        const data = await res.json();
                        const modeEl = document.getElementById('schedulerMode');
                        const timeEl = document.getElementById('schedulerTime');
                        if (data.active_mode) {
                            modeEl.textContent = data.active_mode.replace(/_/g, ' ');
                            modeEl.className = 'scheduler-mode active';
                        } else {
                            modeEl.textContent = 'idle';
                            modeEl.className = 'scheduler-mode';
                        }
                        if (data.current_time) {
                            timeEl.textContent = data.current_time;
                        }
                        if (data.interrupts_queued > 0) {
                            modeEl.textContent += ' 🔔' + data.interrupts_queued;
                        }
                    }
                } catch (e) {
                    // ignore
                }
            }
            setInterval(updateSchedulerStatus, 5000);
            updateSchedulerStatus();
        </script>
    </div>
</body>
</html>
