{% extends "plugin.html" %}

{% block content %}
<div class="mood-container">
    <div class="photo-frame">
        {% if flower_image %}
        <img src="{{ flower_image }}" alt="{{ flower.en }}">
        {% else %}
        <div class="photo-placeholder">{{ flower.ja }}</div>
        {% endif %}
    </div>
    <div class="mood-info">
        <h1 class="flower-name">{{ flower.ja }}</h1>
        <p class="flower-en">{{ flower.en }}</p>
        <p class="hanakotoba">花言葉: {{ flower.kotoba }}</p>
        <div class="divider"></div>
        <p class="mood-msg">{{ mood.ja }}</p>
        <p class="mood-msg-en">{{ mood.en }}</p>
        {% if flower.poem %}
        <p class="poem">{{ flower.poem }}</p>
        {% endif %}
    </div>
</div>
{% endblock %}
