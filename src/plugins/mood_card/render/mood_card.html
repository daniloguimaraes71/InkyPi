<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-base: {{ palette.bg or '#FAF8F5' }};
            --text-primary: {{ palette.primary or '#2C2C2C' }};
            --text-secondary: #666666;
            --text-tertiary: #999999;
            --border-subtle: #E0D8C8;
            --season-primary: {{ palette.primary or '#8B7355' }};
            --season-accent: {{ palette.accent or '#C9A9A6' }};
            --font-serif: 'Noto Serif JP', serif;
            --font-sans: 'Noto Sans JP', sans-serif;
        }

        body {
            width: 800px;
            height: 480px;
            margin: 0;
            padding: 40px 48px;
            box-sizing: border-box;
            background-color: var(--bg-base);
            color: var(--text-primary);
            overflow: hidden;
            position: relative;
        }

        .micro-season-stamp {
            position: absolute;
            top: 40px;
            right: 48px;
            text-align: right;
        }
        .micro-season-kanji {
            font-family: var(--font-serif);
            font-size: 14px;
            color: var(--season-primary);
            letter-spacing: 0.1em;
        }

        .mood-grid { display: flex; height: 100%; align-items: center; gap: 40px; }
        
        .photo-frame { 
            width: 240px; 
            height: 320px; 
            background: #eee; 
            border: 1px solid var(--border-subtle);
            padding: 8px;
            background-color: white;
            flex-shrink: 0;
        }
        
        .photo-frame img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: grayscale(20%) sepia(10%); 
        }
        
        .mood-text { flex: 1; }
        
        .flower-name { 
            font-family: var(--font-serif); 
            font-size: 48px; 
            margin: 0 0 8px 0; 
        }
        
        .flower-en { 
            font-family: var(--font-sans); 
            font-size: 16px; 
            color: var(--text-tertiary); 
            margin-bottom: 24px; 
        }
        
        .hanakotoba { 
            font-family: var(--font-serif); 
            font-size: 20px; 
            color: var(--season-accent); 
            padding-left: 16px; 
            border-left: 2px solid var(--season-accent); 
            margin-bottom: 32px; 
        }
        
        .mood-msg { 
            font-family: var(--font-sans); 
            font-size: 16px; 
            line-height: 1.8; 
            color: var(--text-secondary); 
        }

        .poem {
            font-family: var(--font-serif);
            font-size: 14px;
            color: var(--text-tertiary);
            margin-top: 24px;
            font-style: italic;
        }
    </style>
</head>
<body>
    {% if season_info %}
    <div class="micro-season-stamp">
        <div class="micro-season-kanji">候: {{ season_info.micro_season.kanji }}</div>
    </div>
    {% endif %}

    <div class="mood-grid">
        <div class="photo-frame">
            {% if flower_image %}
            <img src="{{ flower_image }}" alt="{{ flower.en }}">
            {% else %}
            <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 64px; color: var(--text-tertiary);">{{ flower.ja }}</div>
            {% endif %}
        </div>
        <div class="mood-text">
            <h1 class="flower-name">{{ flower.ja }}</h1>
            <div class="flower-en">{{ flower.en }}</div>
            <div class="hanakotoba">花言葉：{{ flower.kotoba }}</div>
            <p class="mood-msg">{{ mood.ja }}<br>{{ mood.en }}</p>
            {% if flower.poem %}
            <p class="poem">{{ flower.poem }}</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
