<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-base: {{ palette.bg or '#FAF8F5' }};
            --text-primary: {{ palette.primary or '#2C2C2C' }};
            --text-secondary: #666666;
            --text-tertiary: #999999;
            --border-subtle: #E0D8C8;
            --season-primary: {{ palette.primary or '#8B7355' }};
            --font-serif: 'Noto Serif JP', serif;
            --font-sans: 'Noto Sans JP', sans-serif;
        }

        body {
            width: 800px;
            height: 480px;
            margin: 0;
            padding: 40px 48px;
            box-sizing: border-box;
            background-color: var(--bg-base);
            color: var(--text-primary);
            overflow: hidden;
        }

        .event-card { 
            display: flex; 
            height: 100%; 
            background: #FFFFFF; 
            border: 1px solid var(--border-subtle); 
            border-radius: 4px; 
            overflow: hidden; 
        }
        
        .event-image { 
            flex: 0 0 45%; 
        }
        
        .event-image img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: contrast(1.1) grayscale(10%); 
        }
        
        .event-details { 
            flex: 1; 
            padding: 40px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
        }
        
        .event-tag { 
            display: inline-block; 
            padding: 4px 12px; 
            border: 1px solid var(--season-primary); 
            color: var(--season-primary); 
            font-family: var(--font-sans); 
            font-size: 12px; 
            border-radius: 20px; 
            margin-bottom: 16px; 
            align-self: flex-start; 
        }
        
        .event-title { 
            font-family: var(--font-serif); 
            font-size: 28px; 
            line-height: 1.4; 
            margin: 0 0 16px 0; 
        }
        
        .event-logistics { 
            font-family: var(--font-sans); 
            font-size: 14px; 
            color: var(--text-secondary); 
            line-height: 1.8; 
        }
        
        .event-logistics strong { 
            color: var(--text-primary); 
            font-weight: 500; 
        }

        .weekend-label {
            font-family: var(--font-sans);
            font-size: 12px;
            color: var(--text-tertiary);
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="event-card">
        <div class="event-image">
            {% if event_image %}
            <img src="{{ event_image }}" alt="{{ event.name }}">
            {% else %}
            <div style="width: 100%; height: 100%; background: var(--border-subtle); display: flex; align-items: center; justify-content: center; font-size: 48px; color: var(--text-tertiary);">{{ event.type }}</div>
            {% endif %}
        </div>
        <div class="event-details">
            <div class="weekend-label">{{ weekend_date }}</div>
            <span class="event-tag">週末のおすすめ</span>
            <h2 class="event-title">{{ event.name }}<br><span style="font-size: 16px; color: var(--text-secondary);">{{ event.desc }}</span></h2>
            <div class="event-logistics">
                <strong>場所:</strong> {{ event.location }}<br>
                <strong>タイプ:</strong> {{ event.type }}<br>
                <strong>季節:</strong> {{ season_label }}
            </div>
        </div>
    </div>
</body>
</html>
