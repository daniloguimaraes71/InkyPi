<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --bg-dark: #1A1A2E;
            --text-primary: #E0D8C0;
            --text-secondary: #B0A890;
            --text-light: #807860;
            --accent-gold: {{ palette.primary or '#8B7355' }};
            --font-serif: 'Noto Serif JP', serif;
            --font-sans: 'Noto Sans JP', sans-serif;
        }

        body {
            width: {{ width }}px;
            height: {{ height }}px;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
            font-family: var(--font-sans);
        }

        .card-container {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .moon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--text-primary);
            opacity: 0.7;
            margin-bottom: 32px;
            box-shadow: inset -10px -4px 0 0 var(--bg-dark);
        }

        .greeting {
            font-family: var(--font-serif);
            font-size: 32px;
            color: var(--text-primary);
            margin-bottom: 28px;
            letter-spacing: 0.1em;
        }

        .poem {
            font-family: var(--font-serif);
            font-size: 20px;
            line-height: 2;
            color: #B0B8C8;
            letter-spacing: 0.15em;
        }

    </style>
</head>
<body>
    <div class="card-container">
        <div class="content">
            <div class="moon"></div>
            <h2 class="greeting">おやすみなさい</h2>
            {% if poem %}
            <div class="poem">
                {% for line in poem.split('\n') %}
                    {{ line }}{% if not loop.last %}<br>{% endif %}
                {% endfor %}
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
