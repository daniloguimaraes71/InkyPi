{% extends "plugin.html" %}

{% block content %}
<div class="goodnight-container">
    <div class="content">
        <div class="moon"></div>
        <h2 class="greeting">おやすみなさい</h2>
        {% if poem %}
        <div class="poem">
            {% for line in poem.split('\n') %}
                {{ line }}{% if not loop.last %}<br>{% endif %}
            {% endfor %}
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
